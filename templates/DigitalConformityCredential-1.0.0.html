<div class="untp-dcc">
  <!--
    UNTP Digital Conformity Credential, v0.8.0 data model. Template version
    1.0.0. An HTML fragment for the W3C html render suite (Verifiable
    Credential Rendering Methods, Working Draft of 6 October 2026, section
    2.2.2). The script below reads the credential from the wrapper's
    <script name="credential" type="application/vc"> data block, builds the
    page with textContent only, and calls window.renderMethodReady(). Nothing
    is fetched at render time.

    Proof-of-concept copy. The changes for the PoC's host-mediated links
    extension to the Working Draft are marked "PoC extension: host-mediated
    links".
  -->
  <style>
    .untp-dcc {
      --color-primary: rgba(31, 90, 149, 1);
      --color-secondary: rgba(247, 250, 253, 1);
      --color-white: rgba(255, 255, 255, 1);
      --color-black: rgba(0, 0, 0, 1);
      --color-gray-700: rgba(35, 46, 61, 1);
      --color-gray-600: rgba(85, 96, 110, 1);
      --color-gray-400: rgba(212, 214, 216, 1);
      --color-gray-300: rgba(237, 239, 240, 1);
      --color-icon: #94c4f5;
      --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-weight-light: 300;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semi-bold: 600;
      --font-weight-bold: 700;
      --font-weight-black: 900;
      font-family: var(--font-family);
    }

    .untp-dcc * {
      margin: 0;
      box-sizing: border-box;
    }

    .untp-dcc .conformity-attestation {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      word-break: break-word;
    }

    .untp-dcc .attestation-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      background-color: var(--color-white);
    }

    .untp-dcc .credential-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 16px;
      background-color: var(--color-gray-700);
      width: 100%;
    }

    .untp-dcc .credential-details {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }

    .untp-dcc .credential-title-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-self: stretch;
    }

    .untp-dcc .credential-label {
      font-weight: var(--font-weight-medium);
      color: var(--color-white);
      font-size: 16px;
      line-height: 22px;
    }

    .untp-dcc .credential-title {
      font-weight: var(--font-weight-black);
      color: var(--color-white);
      font-size: 30px;
      line-height: 32.5px;
    }

    .untp-dcc .credential-info {
      display: flex;
      flex-direction: column;
      color: var(--color-white);
      font-size: 16px;
      line-height: 22px;
    }

    .untp-dcc .credential-info .info-label {
      color: var(--color-gray-400);
      font-size: 14px;
      line-height: 19.25px;
    }

    .untp-dcc .credential-info .info-value {
      font-weight: var(--font-weight-bold);
    }

    .untp-dcc .credential-info .id-text,
    .untp-dcc .evidence-links .id-text {
      color: var(--color-gray-400);
    }

    .untp-dcc a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(79, 149, 221, 1);
      text-underline-offset: 3px;
    }

    .untp-dcc .credential-header a {
      text-decoration-color: var(--color-white);
    }

    .untp-dcc .credential-description {
      align-self: stretch;
      color: var(--color-white);
      font-size: 16px;
      line-height: 18.9px;
    }

    .untp-dcc .evidence-links {
      display: flex;
      align-items: center;
      gap: 12px;
      align-self: stretch;
      padding: 8px 0;
    }

    .untp-dcc .evidence-links svg {
      flex-shrink: 0;
      fill: var(--color-icon);
    }

    .untp-dcc .evidence-name-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--color-white);
    }

    .untp-dcc .evidence-name {
      font-weight: var(--font-weight-semi-bold);
      font-size: 16px;
      line-height: 17.4px;
    }

    .untp-dcc .assessment-section {
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-self: stretch;
      padding: 0 16px;
    }

    .untp-dcc .credential-details-inner,
    .untp-dcc .issuer-endorsement-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }

    .untp-dcc .assessment-title,
    .untp-dcc .endorsement-title,
    .untp-dcc .issuing-title {
      font-weight: var(--font-weight-bold);
      color: var(--color-black);
      font-size: 20px;
      line-height: 21.8px;
    }

    .untp-dcc .assessment-description {
      margin-top: 12px;
      color: var(--color-black);
      font-size: 16px;
      line-height: 18.9px;
    }

    .untp-dcc .assessment-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      padding: 16px;
      align-self: stretch;
      background-color: var(--color-secondary);
      border-radius: 4px;
    }

    .untp-dcc .assessment-topic {
      font-weight: var(--font-weight-regular);
      color: var(--color-primary);
      font-size: 18px;
      line-height: 21.2px;
    }

    .untp-dcc .card-description {
      font-size: 14px;
      color: var(--color-gray-600);
    }

    .untp-dcc .assessment-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .untp-dcc .subheader-title {
      font-weight: var(--font-weight-medium);
      color: var(--color-gray-700);
      font-size: 16px;
    }

    .untp-dcc .values-container {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .untp-dcc .data-row-alt,
    .untp-dcc .data-row-details {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 16px;
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--color-gray-400);
      width: 100%;
    }

    .untp-dcc .data-row-details {
      grid-template-columns: 1fr 2fr;
    }

    .untp-dcc .data-row {
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--color-gray-400);
      width: 100%;
    }

    .untp-dcc .data-label {
      color: var(--color-gray-600);
      font-size: 16px;
      line-height: 22px;
    }

    .untp-dcc .data-text {
      display: flex;
      flex-direction: column;
      font-weight: var(--font-weight-medium);
      color: var(--color-gray-700);
      font-size: 16px;
      line-height: 22px;
    }

    .untp-dcc .data-text .finding {
      font-weight: var(--font-weight-regular);
    }

    .untp-dcc .id-text {
      font-size: 13px;
      font-weight: var(--font-weight-regular);
      color: var(--color-gray-600);
      word-break: break-all;
    }

    .untp-dcc .conformity-topic-tag {
      display: inline-block;
      padding: 2px 8px;
      background-color: rgba(31, 90, 149, 0.1);
      border-radius: 4px;
      font-size: 13px;
      color: var(--color-primary);
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .untp-dcc .criteria-name {
      font-weight: var(--font-weight-light);
      color: var(--color-black);
      font-size: 16px;
      line-height: 18.88px;
    }

    .untp-dcc .accreditation-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .untp-dcc .accreditation-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .untp-dcc .accreditation-image {
      height: 50px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      align-self: flex-start;
    }

    .untp-dcc .accreditation-details {
      color: var(--color-gray-700);
      font-weight: var(--font-weight-medium);
      font-size: 16px;
      line-height: 17.4px;
    }

    .untp-dcc .accreditation-note {
      font-size: 14px;
      color: var(--color-gray-600);
    }

    .untp-dcc .issuing-details-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 24px 16px 36px;
      background-color: var(--color-gray-300);
      width: 100%;
    }

    @media (min-width: 1200px) {
      .untp-dcc .conformity-attestation {
        max-width: 1200px;
      }
    }
  </style>

  <div class="conformity-attestation" id="untp-dcc-root"></div>

  <script>
    (function () {
      'use strict';

      var EVIDENCE_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M2 18C1.45 18 0.979333 17.8043 0.588 17.413C0.196667 17.0217 0.000666667 16.5507 0 16V2C0 1.45 0.196 0.979333 0.588 0.588C0.98 0.196667 1.45067 0.000666667 2 0H16C16.55 0 17.021 0.196 17.413 0.588C17.805 0.98 18.0007 1.45067 18 2V16C18 16.55 17.8043 17.021 17.413 17.413C17.0217 17.805 16.5507 18.0007 16 18H2ZM2 2V16H16V2H14V9L11.5 7.5L9 9V2H2Z"/></svg>';
      var CERTIFICATE_ICON = '<svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M16 4H4V0H16V4ZM16 9.5C16.2833 9.5 16.521 9.404 16.713 9.212C16.905 9.02 17.0007 8.78267 17 8.5C16.9993 8.21733 16.9033 7.98 16.712 7.788C16.5207 7.596 16.2833 7.5 16 7.5C15.7167 7.5 15.4793 7.596 15.288 7.788C15.0967 7.98 15.0007 8.21733 15 8.5C14.9993 8.78267 15.0953 9.02033 15.288 9.213C15.4807 9.40567 15.718 9.50133 16 9.5ZM14 16V12H6V16H14ZM16 18H4V14H0V8C0 7.15 0.291667 6.43767 0.875 5.863C1.45833 5.28833 2.16667 5.00067 3 5H17C17.85 5 18.5627 5.28767 19.138 5.863C19.7133 6.43833 20.0007 7.15067 20 8V14H16V18Z"/></svg>';

      function ready(err) {
        if (typeof window.renderMethodReady === 'function') {
          window.renderMethodReady(err);
        }
      }

      // A value counts as present unless it is undefined, null, a blank
      // string or an empty array. Absent values produce no row and no label.
      function has(value) {
        if (value === undefined || value === null) return false;
        if (typeof value === 'string') return value.trim() !== '';
        if (Array.isArray(value)) return value.some(has);
        return true;
      }

      function list(value) {
        return has(value) ? [].concat(value).filter(has) : [];
      }

      // PoC extension: host-mediated links
      // The JSON Pointer (RFC 6901) of a credential value,
      // so a link can name where its URL came from instead of the URL itself.
      function at(pointer, key) {
        return pointer + '/' + String(key).replace(/~/g, '~0').replace(/\//g, '~1');
      }

      // PoC extension: host-mediated links
      // Like list(), but keeping each item's pointer.
      function listAt(value, pointer) {
        if (!has(value)) return [];
        if (!Array.isArray(value)) return [{ value: value, pointer: pointer }];
        return value
          .map(function (item, i) { return { value: item, pointer: at(pointer, i) }; })
          .filter(function (item) { return has(item.value); });
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (has(text)) node.textContent = String(text);
        return node;
      }

      function append(parent, children) {
        children.forEach(function (child) {
          if (child) parent.appendChild(child);
        });
        return parent;
      }

      function icon(markup) {
        var holder = document.createElement('template');
        holder.innerHTML = markup;
        return holder.content.firstChild;
      }

      function measure(m) {
        if (!m || typeof m.value !== 'number') return '';
        return has(m.unit) ? m.value + ' ' + m.unit : String(m.value);
      }

      // An image carried in the credential as base64 data. Only image media
      // types are used, and an image that does not decode is removed, so a
      // broken-image icon never appears.
      function image(img, className) {
        if (!img || !has(img.imageData) || !/^image\/[A-Za-z0-9.+-]+$/.test(img.mediaType || '')) return null;
        if (!/^[A-Za-z0-9+/=\s]+$/.test(img.imageData)) return null;
        var node = el('img', className);
        node.alt = has(img.name) ? img.name : '';
        node.addEventListener('error', function () { node.remove(); });
        node.src = 'data:' + img.mediaType + ';base64,' + img.imageData.replace(/\s/g, '');
        return node;
      }

      // An anchor for an http(s) target, otherwise plain text, so a credential
      // value never becomes a javascript: or other scheme link.
      function link(text, url, tag, pointer) {
        if (typeof url === 'string' && /^https?:\/\//i.test(url)) {
          var anchor = el('a', null, text);
          anchor.href = url;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          // PoC extension: host-mediated links
          // When the host offers renderMethodOpenLink, the
          // click names the pointer of the URL in the credential and the host
          // decides what to open. Without it the anchor is left as it is.
          if (pointer) {
            anchor.addEventListener('click', function (event) {
              if (typeof window.renderMethodOpenLink === 'function') {
                event.preventDefault();
                window.renderMethodOpenLink(pointer);
              }
            });
          }
          return anchor;
        }
        return el(tag || 'span', null, text);
      }

      // A name linked to the identifier it refers to, with the identifier also
      // shown as text. A renderer's sandbox usually blocks the click, so the
      // target has to be readable on the page. pointer is the JSON Pointer of
      // id in the credential (PoC extension: host-mediated links).
      function named(name, id, className, pointer) {
        var value = el('div', className || 'data-text');
        if (has(name)) {
          value.appendChild(link(name, id, null, pointer));
          if (has(id)) value.appendChild(el('span', 'id-text', id));
        } else if (has(id)) {
          value.appendChild(link(id, id, null, pointer));
        }
        return value.childNodes.length ? value : null;
      }

      function headerInfo(label, valueNode) {
        if (!valueNode) return null;
        return append(el('div', 'credential-info'), [el('p', 'info-label', label), valueNode]);
      }

      function headerText(label, value) {
        return has(value) ? headerInfo(label, el('div', 'info-value', value)) : null;
      }

      function evidence(title, target, svg, pointer) {
        if (!target || !has(target.linkURL)) return null;
        var box = el('div', 'evidence-links');
        box.appendChild(icon(svg));
        var names = el('div', 'evidence-name-container');
        names.appendChild(el('div', 'evidence-name', title));
        if (has(target.linkName)) names.appendChild(link(target.linkName, target.linkURL, null, at(pointer, 'linkURL'))); // PoC extension: host-mediated links
        names.appendChild(el('span', 'id-text', target.linkURL));
        box.appendChild(names);
        return box;
      }

      // PoC extension: host-mediated links
      // pointer is the subject's place in the credential,
      // and at() and listAt() give each link the pointer of its URL.
      function renderHeader(subject, pointer) {
        var details = el('div', 'credential-details');
        var title = el('div', 'credential-title-group');
        title.appendChild(el('div', 'credential-label', 'CONFORMITY CREDENTIAL'));
        if (has(subject.name)) title.appendChild(el('h1', 'credential-title', subject.name));
        details.appendChild(title);
        var party = subject.issuedToParty;
        if (party) details.appendChild(headerInfo('Issued to:', named(party.name, party.id, 'info-value', at(at(pointer, 'issuedToParty'), 'id'))));
        if (has(subject.description)) details.appendChild(el('p', 'credential-description', subject.description));
        append(details, [
          headerText('Level of independent assurance:', subject.assessorLevel),
          headerText('Assurance pathway:', subject.assessmentLevel),
          headerText('Evidence selection:', subject.evidenceSelection),
          headerText('Attestation type:', subject.attestationType)
        ]);
        listAt(subject.coverage, at(pointer, 'coverage')).forEach(function (item) {
          var c = item.value;
          var label = has(c.coverageType) ? 'Covers (' + c.coverageType + '):' : 'Covers:';
          details.appendChild(headerInfo(label, named(c.name, c.id, 'info-value', at(item.pointer, 'id'))));
        });
        var scheme = subject.licensedByScheme;
        if (scheme) details.appendChild(headerInfo('Licensed by scheme:', named(scheme.name, scheme.id, 'info-value', at(at(pointer, 'licensedByScheme'), 'id'))));

        var links = append(el('div', 'credential-details'), [
          evidence('Auditable Evidence', subject.auditableEvidence, EVIDENCE_ICON, at(pointer, 'auditableEvidence')),
          evidence('Printable Certificate', subject.conformityCertificate, CERTIFICATE_ICON, at(pointer, 'conformityCertificate'))
        ]);
        var header = append(el('header', 'credential-header'), [details, links.childNodes.length ? links : null]);
        return header;
      }

      function topicTags(criteria) {
        var seen = {};
        var tags = [];
        list(criteria).forEach(function (criterion) {
          list(criterion.conformityTopic).forEach(function (topic) {
            var key = topic.id || topic.name;
            if (has(topic.name) && !seen[key]) {
              seen[key] = true;
              tags.push(el('span', 'conformity-topic-tag', topic.name));
            }
          });
        });
        return tags.length ? append(el('div'), tags) : null;
      }

      function details(title, rows) {
        rows = rows.filter(Boolean);
        if (!rows.length) return null;
        var box = el('section', 'assessment-details');
        box.appendChild(el('h4', 'subheader-title', title));
        box.appendChild(append(el('div', 'values-container'), rows));
        return box;
      }

      function performanceRow(performance) {
        var parts = [measure(performance.measure)];
        var score = performance.score;
        if (score && has(score.code)) {
          parts.push(typeof score.rank === 'number' ? score.code + ' (rank ' + score.rank + ')' : score.code);
        }
        parts.push(performance.determination);
        parts = parts.filter(has);
        var value = el('div', 'data-text');
        if (parts.length) value.appendChild(el('span', null, parts.join(', ')));
        if (score && has(score.definition)) value.appendChild(el('span', 'finding', score.definition));
        if (has(performance.qualitativeFinding)) value.appendChild(el('span', 'finding', performance.qualitativeFinding));
        if (!value.childNodes.length) return null;
        var metric = performance.metric && performance.metric.name;
        return append(el('div', 'data-row-alt'), [el('div', 'data-label', has(metric) ? metric : 'Result'), value]);
      }

      // PoC extension: host-mediated links
      // pointer is the assessment's place in the credential.
      function renderAssessment(a, pointer) {
        var card = el('article', 'assessment-card');
        if (has(a.name)) card.appendChild(el('h3', 'assessment-topic', a.name));
        if (has(a.description)) card.appendChild(el('p', 'card-description', a.description));
        append(card, [
          topicTags(a.assessmentCriteria),
          details('Assessed performance', list(a.assessedPerformance).map(performanceRow)),
          details('Assessment Criteria', listAt(a.assessmentCriteria, at(pointer, 'assessmentCriteria')).map(function (item) {
            return named(item.value.name, item.value.id, 'criteria-name', at(item.pointer, 'id'));
          }).map(function (node) { return node ? append(el('div', 'data-row'), [node]) : null; })),
          details('Assessed facilities', listAt(a.assessedFacility, at(pointer, 'assessedFacility')).map(function (item) {
            var f = item.value;
            return f.facility ? append(el('div', 'data-row'), [named(f.facility.name, f.facility.id, null, at(at(item.pointer, 'facility'), 'id'))]) : null;
          })),
          details('Assessed products', listAt(a.assessedProduct, at(pointer, 'assessedProduct')).map(function (item) {
            var p = item.value;
            return p.product ? append(el('div', 'data-row'), [named(p.product.name, p.product.id, null, at(at(item.pointer, 'product'), 'id'))]) : null;
          })),
          details('Assessed organisation', [a.assessedOrganisation ? append(el('div', 'data-row'), [named(a.assessedOrganisation.name, a.assessedOrganisation.id, null, at(at(pointer, 'assessedOrganisation'), 'id'))]) : null]),
          details('Other details', [has(a.assessmentDate) ? append(el('div', 'data-row-details'), [el('div', 'data-label', 'Assessed'), el('div', 'data-text', a.assessmentDate)]) : null])
        ]);
        return card;
      }

      function renderAssessments(subject, pointer) {
        var assessments = listAt(subject.conformityAssessment, at(pointer, 'conformityAssessment')); // PoC extension: host-mediated links
        if (!assessments.length) return null;
        var box = el('section', 'credential-details-inner');
        var head = el('header');
        head.appendChild(el('h2', 'assessment-title', 'Assessments'));
        head.appendChild(el('p', 'assessment-description', 'The list of specific assessments made within this conformity attestation.'));
        box.appendChild(head);
        assessments.forEach(function (item) { box.appendChild(renderAssessment(item.value, item.pointer)); });
        return box;
      }

      function renderTrustmark(subject) {
        var mark = subject.trustmark;
        if (!mark || !(has(mark.name) || has(mark.imageData))) return null;
        var box = el('section', 'issuer-endorsement-section');
        append(box, [
          image(mark, 'accreditation-image'),
          has(mark.name) ? el('p', 'accreditation-details', mark.name) : null,
          has(mark.description) ? el('p', 'accreditation-note', mark.description) : null
        ]);
        return box.childNodes.length ? box : null;
      }

      function renderEndorsements(subject, pointer) {
        var endorsements = listAt(subject.authorityEndorsement, at(pointer, 'authorityEndorsement')); // PoC extension: host-mediated links
        if (!endorsements.length) return null;
        var items = el('div', 'accreditation-list');
        endorsements.forEach(function (item) {
          var e = item.value;
          var authority = e.grantingAuthority || {};
          var evidenceLink = e.authorityEvidence || {};
          append(items, [append(el('div', 'accreditation-item'), [
            image(e.trustmark, 'accreditation-image'),
            has(e.name) ? el('div', 'accreditation-details', e.name) : null,
            has(e.endorsementType) ? el('p', 'accreditation-note', 'Endorsement type: ' + e.endorsementType) : null,
            has(authority.name) ? append(el('p', 'accreditation-note', 'Granted by: '), [link(authority.name, authority.id, null, at(at(item.pointer, 'grantingAuthority'), 'id'))]) : null,
            has(authority.id) ? el('p', 'id-text', authority.id) : null,
            has(evidenceLink.linkName) ? append(el('p', 'accreditation-note'), [link(evidenceLink.linkName, evidenceLink.linkURL, null, at(at(item.pointer, 'authorityEvidence'), 'linkURL'))]) : null,
            has(evidenceLink.linkURL) ? el('p', 'id-text', evidenceLink.linkURL) : null
          ])]);
        });
        var box = el('section', 'issuer-endorsement-section');
        box.appendChild(el('h2', 'endorsement-title', 'Issuer endorsement'));
        box.appendChild(items);
        return box;
      }

      function renderIssuing(vc) {
        var issuer = typeof vc.issuer === 'string' ? { id: vc.issuer } : vc.issuer || {};
        var issuerPointer = typeof vc.issuer === 'string' ? '/issuer' : '/issuer/id'; // PoC extension: host-mediated links
        var rows = [
          named(issuer.name, issuer.id) ? append(el('div', 'data-row-alt'), [el('div', 'data-label', 'Issued by'), named(issuer.name, issuer.id, null, issuerPointer)]) : null,
          has(vc.validFrom) ? append(el('div', 'data-row-alt'), [el('div', 'data-label', 'Valid from'), el('div', 'data-text', vc.validFrom)]) : null,
          has(vc.validUntil) ? append(el('div', 'data-row-alt'), [el('div', 'data-label', 'Valid until'), el('div', 'data-text', vc.validUntil)]) : null
        ].filter(Boolean);
        if (!rows.length) return null;
        var box = el('section', 'issuing-details-section');
        box.appendChild(el('h2', 'issuing-title', 'Issuing details'));
        box.appendChild(append(el('div', 'values-container'), rows));
        return box;
      }

      function render() {
        var root = document.getElementById('untp-dcc-root');
        try {
          var block = document.querySelector('head > script[name="credential"]');
          if (!block) throw new Error('No credential data block found');
          var vc = JSON.parse(block.textContent);
          // PoC extension: host-mediated links
          // Each subject keeps its pointer in the credential.
          var subjects = listAt(vc.credentialSubject, '/credentialSubject').filter(function (s) { return typeof s.value === 'object'; });
          if (!subjects.length) throw new Error('The credential has no credentialSubject to render');
          subjects.forEach(function (item) {
            var subject = item.value;
            var content = el('div', 'attestation-content');
            content.appendChild(renderHeader(subject, item.pointer));
            var body = append(el('div', 'assessment-section'), [
              renderAssessments(subject, item.pointer),
              renderTrustmark(subject),
              renderEndorsements(subject, item.pointer)
            ]);
            if (body.childNodes.length) content.appendChild(body);
            root.appendChild(content);
          });
          append(root, [renderIssuing(vc)]);
          ready();
        } catch (err) {
          if (root) root.textContent = '';
          ready(err instanceof Error ? err : new Error(String(err)));
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    })();
  </script>
</div>
